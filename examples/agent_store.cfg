format: "agents-yapyon-v0.6.5"
defaults:
  secret:
    backend: "example_secret"
    root: "agents" # <-- Note that this wouldn't be needed, since that's the default. :)
# <-- These are defaults, so they do not need to be in the config - but here are their values -->
# paths:
#   shared: "shared"
#   entries: "entries"
env_vars:
  from_host: []
  additions: ["AGENT_STORE_EXAMPLE_ENDPOINT"]
agents:
  "scout":
    path: "/example/agents/entries/scout"
  "unprefixed":
    path: "/example/agents/entries/unprefixed"
  "shared":
    path: "/example/agents/entries/shared"
